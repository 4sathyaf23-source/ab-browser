<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AB Browser</title>
<style>
  :root {
    --bg: #202124;
    --bar: #2f3033;
    --tab: #3a3b3f;
    --tab-active: #4a4b50;
    --border: #3c4043;
    --input-bg: #303134;
    --accent: #8ab4f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #fff;
    overflow: hidden;
  }

  /* Tab strip */
  .tab-strip {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 6px 8px 0;
    background: var(--bg);
    overflow-x: auto;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 200px;
    min-width: 120px;
    padding: 7px 10px;
    background: var(--tab);
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 13px;
    user-select: none;
  }
  .tab.active { background: var(--bar); }
  .tab-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .tab-close {
    background: none;
    border: none;
    color: #ccc;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    width: 20px;
    height: 20px;
  }
  .tab-close:hover { background: #5f6066; color: #fff; }
  .new-tab {
    background: none;
    border: none;
    color: #ccc;
    font-size: 20px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .new-tab:hover { background: var(--tab); }

  /* Navigation bar */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
  }
  .nav-btn {
    padding: 6px 12px;
    background: var(--tab-active);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .nav-btn:hover { background: #5f6066; }
  #url {
    flex: 1;
    padding: 8px 14px;
    border-radius: 20px;
    border: none;
    background: var(--input-bg);
    color: #fff;
    font-size: 14px;
  }
  #url:focus { outline: 2px solid var(--accent); }

  /* Sliding toggle switch */
  .toggle-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #ccc;
    user-select: none;
    padding: 0 5px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 20px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #5f6066;
    transition: .3s;
    border-radius: 20px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(20px); }

  /* Workspace */
  .workspace {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .main-view {
    flex: 1;
    display: flex;
    min-width: 0;
  }
  webview.page { display: none; border: none; background: #fff; }
  webview.page.active { display: flex; flex: 1; }

  /* AI sidebar (webview lives directly here; no nested webview) */
  .sidebar {
    width: 380px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
  }
  .sidebar.hidden { display: none; }
  .sidebar-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  .sidebar-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }
  .sidebar webview { flex: 1; width: 100%; border: none; background: #1a1a1a; }
</style>
</head>
<body>

  <div class="tab-strip" id="tabs">
    <button class="new-tab" id="new-tab" title="New tab (Ctrl+T)">+</button>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="back">◀</button>
    <button class="nav-btn" id="forward">▶</button>
    <button class="nav-btn" id="reload">↻</button>
    <input type="text" id="url" placeholder="Search or enter address">
    <button class="nav-btn" id="go" style="background:#007bff;">Go</button>

    <div class="toggle-container">
      <span>AI Copilot</span>
      <label class="switch">
        <input type="checkbox" id="ai-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="workspace">
    <div class="main-view" id="main-view"></div>
    <div class="sidebar" id="ai-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-dot"></div>
        AB AI Workspace (Powered by DuckDuckGo)
      </div>
      <webview id="ai-view" src="https://duck.ai" partition="persist:ai_session" allowpopups></webview>
    </div>
  </div>

<script>
  const HOME = 'https://www.google.com';
  const SESSION_KEY = 'ab_saved_session_urls';
  const tabsEl = document.getElementById('tabs');
  const newTabBtn = document.getElementById('new-tab');
  const mainView = document.getElementById('main-view');
  const urlInput = document.getElementById('url');
  const aiSidebar = document.getElementById('ai-sidebar');
  const aiToggle = document.getElementById('ai-toggle');

  let tabs = [];
  let activeId = null;
  let counter = 0;

  // Turn typed text into a URL or a Google search
  function toUrl(text) {
    text = text.trim();
    if (!text) return null;

    if (/^https?:\/\//i.test(text)) return text;

    const domainRegex = /^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i;
    const localRegex = /^localhost(:\d+)?(\/.*)?$/i;
    if (domainRegex.test(text) || localRegex.test(text)) {
      return 'https://' + text;
    }

    return 'https://www.google.com/search?q=' + encodeURIComponent(text);
  }

  function activeTab() {
    return tabs.find(t => t.id === activeId);
  }

  function saveSessionState() {
    try {
      const stateData = tabs.map(t => {
        let currentUrl = '';
        try { currentUrl = t.wv.getURL(); } catch (e) {}
        return currentUrl || t.wv.getAttribute('src') || HOME;
      });
      localStorage.setItem(SESSION_KEY, JSON.stringify(stateData));
    } catch (e) {}
  }

  function createTab(url, shouldSave = true) {
    const id = ++counter;

    const wv = document.createElement('webview');
    wv.className = 'page';
    wv.setAttribute('src', url || HOME);
    mainView.appendChild(wv);

    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    const title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = 'New Tab';
    const close = document.createElement('button');
    close.className = 'tab-close';
    close.textContent = '\u00d7';
    tabEl.append(title, close);
    tabsEl.insertBefore(tabEl, newTabBtn);

    tabs.push({ id, wv, tabEl });

    tabEl.addEventListener('click', () => switchTab(id));
    close.addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });

    wv.addEventListener('page-title-updated', (e) => {
      title.textContent = e.title;
      tabEl.title = e.title;
    });
    wv.addEventListener('did-navigate', (e) => {
      if (activeId === id) urlInput.value = e.url;
      saveSessionState();
    });
    wv.addEventListener('did-navigate-in-page', (e) => {
      if (e.isMainFrame && activeId === id) urlInput.value = e.url;
      saveSessionState();
    });

    switchTab(id);
    if (!url) urlInput.focus();
    if (shouldSave) saveSessionState();
  }

  function switchTab(id) {
    activeId = id;
    tabs.forEach(t => {
      const on = t.id === id;
      t.wv.classList.toggle('active', on);
      t.tabEl.classList.toggle('active', on);
      if (on) {
        let u = '';
        try { u = t.wv.getURL(); } catch (e) {}
        urlInput.value = u || t.wv.getAttribute('src') || '';
      }
    });
  }

  function closeTab(id) {
    const index = tabs.findIndex(t => t.id === id);
    if (index === -1) return;
    const [tab] = tabs.splice(index, 1);
    tab.wv.remove();
    tab.tabEl.remove();
    if (tabs.length === 0) {
      createTab();
    } else if (activeId === id) {
      switchTab(tabs[Math.max(0, index - 1)].id);
    }
    saveSessionState();
  }

  function navigate() {
    const url = toUrl(urlInput.value);
    const tab = activeTab();
    if (url && tab) tab.wv.loadURL(url);
  }

  document.getElementById('go').addEventListener('click', navigate);
  urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });
  urlInput.addEventListener('focus', () => urlInput.select());

  document.getElementById('back').addEventListener('click', () => {
    const t = activeTab();
    try { if (t && t.wv.canGoBack()) t.wv.goBack(); } catch (e) {}
  });
  document.getElementById('forward').addEventListener('click', () => {
    const t = activeTab();
    try { if (t && t.wv.canGoForward()) t.wv.goForward(); } catch (e) {}
  });
  document.getElementById('reload').addEventListener('click', () => {
    const t = activeTab();
    try { if (t) t.wv.reload(); } catch (e) {}
  });

  newTabBtn.addEventListener('click', () => createTab());

  aiToggle.addEventListener('change', () => {
    aiSidebar.classList.toggle('hidden', !aiToggle.checked);
  });

  function handleShortcut(key) {
    if (key === 't') createTab();
    if (key === 'w') closeTab(activeId);
    if (key === 'l') urlInput.focus();
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (e.ctrlKey && ['t', 'w', 'l'].includes(key)) {
      e.preventDefault();
      handleShortcut(key);
    }
  });

  if (window.ab) {
    window.ab.onOpenUrl((url) => createTab(url));
    window.ab.onShortcut(handleShortcut);
  }

  // Restore previous session
  let restored = false;
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      const savedUrls = JSON.parse(raw);
      if (Array.isArray(savedUrls) && savedUrls.length > 0) {
        savedUrls.forEach(u => createTab(u, false));
        restored = true;
      }
    }
  } catch (err) {}
  if (!restored) createTab(HOME, false);
</script>
</body>
</html>
