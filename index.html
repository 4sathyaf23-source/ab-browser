<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AB Browser</title>
<style>
  :root {
    --bg: #202124;
    --bar: #2f3033;
    --tab: #3a3b3f;
    --tab-active: #4a4b50;
    --border: #3c4043;
    --input-bg: #303134;
    --accent: #8ab4f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #fff;
    overflow: hidden;
  }

  /* Tab strip */
  .tab-strip {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 6px 8px 0;
    background: var(--bg);
    overflow-x: auto;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 200px;
    min-width: 120px;
    padding: 7px 10px;
    background: var(--tab);
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 13px;
    user-select: none;
  }
  .tab.active { background: var(--bar); }
  .tab-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .tab-close {
    background: none;
    border: none;
    color: #ccc;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    width: 20px;
    height: 20px;
  }
  .tab-close:hover { background: #5f6066; color: #fff; }
  .new-tab {
    background: none;
    border: none;
    color: #ccc;
    font-size: 20px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .new-tab:hover { background: var(--tab); }

  /* Navigation bar */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
  }
  .nav-btn {
    padding: 6px 12px;
    background: var(--tab-active);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  .nav-btn:hover { background: #5f6066; }
  #url {
    flex: 1;
    padding: 8px 14px;
    border-radius: 20px;
    border: none;
    background: var(--input-bg);
    color: #fff;
    font-size: 14px;
  }
  #url:focus { outline: 2px solid var(--accent); }

  /* Workspace */
  .workspace {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .main-view {
    flex: 1;
    display: flex;
    min-width: 0;
  }
  webview.page { display: none; border: none; background: #fff; }
  webview.page.active { display: flex; flex: 1; }

</style>
</head>
<body>

  <div class="tab-strip" id="tabs">
    <button class="new-tab" id="new-tab" title="New tab (Ctrl+T)">+</button>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="back">◀</button>
    <button class="nav-btn" id="forward">▶</button>
    <button class="nav-btn" id="reload">↻</button>
    <input type="text" id="url" placeholder="Search or enter address">
    <button class="nav-btn" id="go" style="background:#007bff;">Go</button>

  </div>

  <div class="workspace">
    <div class="main-view" id="main-view"></div>
  </div>

<script>
  const HOME = new URL('home.html', location.href).href;
  const SESSION_KEY = 'ab_saved_session_urls';
  const tabsEl = document.getElementById('tabs');
  const newTabBtn = document.getElementById('new-tab');
  const mainView = document.getElementById('main-view');
  const urlInput = document.getElementById('url');

  const HIDE_PROMO_JS = `
    (function () {
      const patterns = [/get chrome/i, /install chrome/i, /switch to chrome/i, /choose chrome/i, /download chrome/i, /do not use chrome/i];
      function sweep() {
        document.querySelectorAll('div, section, aside, dialog').forEach(el => {
          if (el.dataset.abChecked) return;
          const txt = el.innerText || '';
          if (txt.length < 250 && patterns.some(p => p.test(txt))) {
            el.style.display = 'none';
            el.dataset.abChecked = '1';
          }
        });
      }
      new MutationObserver(sweep).observe(document.documentElement, { childList: true, subtree: true });
      sweep();
    })();
  `;
  function attachPromoBlocker(wv) {
    wv.addEventListener('dom-ready', () => {
      wv.executeJavaScript(HIDE_PROMO_JS).catch(() => {});
    });
  }

  let tabs = [];
  let activeId = null;
  let counter = 0;

  // Turn typed text into a URL or a Google search
  function toUrl(text) {
    text = text.trim();
    if (!text) return null;

    if (/^https?:\/\//i.test(text)) return text;

    const domainRegex = /^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i;
    const localRegex = /^localhost(:\d+)?(\/.*)?$/i;
    if (domainRegex.test(text) || localRegex.test(text)) {
      return 'https://' + text;
    }

    return 'https://www.google.com/search?q=' + encodeURIComponent(text);
  }

  function activeTab() {
    return tabs.find(t => t.id === activeId);
  }

  function saveSessionState() {
    try {
      const stateData = tabs.map(t => {
        let currentUrl = '';
        try { currentUrl = t.wv.getURL(); } catch (e) {}
        return currentUrl || t.wv.getAttribute('src') || HOME;
      });
      localStorage.setItem(SESSION_KEY, JSON.stringify(stateData));
    } catch (e) {}
  }

  function createTab(url, shouldSave = true) {
    const id = ++counter;

    const wv = document.createElement('webview');
    wv.className = 'page';
    wv.setAttribute('src', url || HOME);
    mainView.appendChild(wv);

    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    const title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = 'New Tab';
    const close = document.createElement('button');
    close.className = 'tab-close';
    close.textContent = '\u00d7';
    tabEl.append(title, close);
    tabsEl.insertBefore(tabEl, newTabBtn);

    tabs.push({ id, wv, tabEl });

    tabEl.addEventListener('click', () => switchTab(id));
    close.addEventListener('click', (e) => { e.stopPropagation(); closeTab(id); });

    wv.addEventListener('page-title-updated', (e) => {
      title.textContent = e.title;
      tabEl.title = e.title;
    });
    wv.addEventListener('did-navigate', (e) => {
      if (activeId === id) urlInput.value = e.url;
      saveSessionState();
    });
    wv.addEventListener('did-navigate-in-page', (e) => {
      if (e.isMainFrame && activeId === id) urlInput.value = e.url;
      saveSessionState();
    });

    wv.addEventListener('did-fail-load', (e) => {
      if (e.isMainFrame && e.errorCode !== -3) {
        title.textContent = 'Error ' + e.errorCode + ': ' + e.errorDescription;
      }
    });
    attachPromoBlocker(wv);

    switchTab(id);
    if (!url) urlInput.focus();
    if (shouldSave) saveSessionState();
  }

  function switchTab(id) {
    activeId = id;
    tabs.forEach(t => {
      const on = t.id === id;
      t.wv.classList.toggle('active', on);
      t.tabEl.classList.toggle('active', on);
      if (on) {
        let u = '';
        try { u = t.wv.getURL(); } catch (e) {}
        urlInput.value = u || t.wv.getAttribute('src') || '';
      }
    });
  }

  function closeTab(id) {
    const index = tabs.findIndex(t => t.id === id);
    if (index === -1) return;
    const [tab] = tabs.splice(index, 1);
    tab.wv.remove();
    tab.tabEl.remove();
    if (tabs.length === 0) {
      createTab();
    } else if (activeId === id) {
      switchTab(tabs[Math.max(0, index - 1)].id);
    }
    saveSessionState();
  }

  function navigate() {
    const url = toUrl(urlInput.value);
    const tab = activeTab();
    if (url && tab) tab.wv.loadURL(url);
  }

  document.getElementById('go').addEventListener('click', navigate);
  urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });
  urlInput.addEventListener('focus', () => urlInput.select());

  document.getElementById('back').addEventListener('click', () => {
    const t = activeTab();
    try { if (t && t.wv.canGoBack()) t.wv.goBack(); } catch (e) {}
  });
  document.getElementById('forward').addEventListener('click', () => {
    const t = activeTab();
    try { if (t && t.wv.canGoForward()) t.wv.goForward(); } catch (e) {}
  });
  document.getElementById('reload').addEventListener('click', () => {
    const t = activeTab();
    try { if (t) t.wv.reload(); } catch (e) {}
  });

  newTabBtn.addEventListener('click', () => createTab());

  function handleShortcut(key) {
    if (key === 't') createTab();
    if (key === 'w') closeTab(activeId);
    if (key === 'l') urlInput.focus();
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (e.ctrlKey && ['t', 'w', 'l'].includes(key)) {
      e.preventDefault();
      handleShortcut(key);
    }
  });

  if (window.ab) {
    window.ab.onOpenUrl((url) => createTab(url));
    window.ab.onShortcut(handleShortcut);
  }

  // Restore previous session
  let restored = false;
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      const savedUrls = JSON.parse(raw);
      if (Array.isArray(savedUrls) && savedUrls.length > 0) {
        savedUrls.forEach(u => createTab(u, false));
        restored = true;
      }
    }
  } catch (err) {}
  if (!restored) createTab(HOME, false);
</script>
</body>
</html>
