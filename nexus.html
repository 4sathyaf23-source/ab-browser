<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Copilot</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1c1c1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .header {
            padding: 12px 16px;
            background: #2f3033;
            border-bottom: 1px solid #3c4043;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8ab4f8;
        }
        .header-icon {
            width: 8px;
            height: 8px;
            background: #8ab4f8;
            border-radius: 50%;
            box-shadow: 0 0 8px #8ab4f8;
        }
        .chat-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        webview {
            width: 100%;
            height: 100%;
            border: none;
            background: #1c1c1e;
        }
    </style>
</head>
<body>

    <!-- CUSTOM BRANDING HEADER TEXT -->
    <div class="header">
        <div class="header-icon"></div>
        AB AI Workspace (Powered by DuckDuckGo)
    </div>

    <div class="chat-container">
        <!-- Secure configurations tell the AI chat engine to run cleanly inside our panel window container -->
        <webview 
            src="https://duckduckgo.com"
            useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
            partition="persist:ai_session"
            allowpopups>
        </webview>
    </div>

</body>
</html>
