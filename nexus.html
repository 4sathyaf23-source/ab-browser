<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .header {
            padding: 12px 16px;
            background: #1a1b1e;
            border-bottom: 1px solid #2f3033;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8ab4f8;
        }
        .header-icon {
            width: 8px;
            height: 8px;
            background: #8ab4f8;
            border-radius: 50%;
            box-shadow: 0 0 8px #8ab4f8;
        }
        .chat-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #1a1b1e;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-icon"></div>
        AB Copilot Workspace
    </div>

    <div class="chat-container">
        <iframe src="https://duckduckgo.com"></iframe>
    </div>

</body>
</html>
